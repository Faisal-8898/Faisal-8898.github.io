name: Build and publish

# Edit the site on the "source" branch. Each push builds it and puts the
# finished site on "main", which GitHub Pages serves as it is.
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          user_name: Faisal Ahmed
          user_email: faaisal8898@gmail.com
          commit_message: Publish site
